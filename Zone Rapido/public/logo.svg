<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#F9C933"/>
  <!-- Winged Helm / Motorcycle Speed Emblem -->
  <g transform="translate(64, 80) scale(0.75)">
    <!-- Speed streaks -->
    <path d="M40 180 H160" stroke="#1E293B" stroke-width="28" stroke-linecap="round"/>
    <path d="M10 240 H180" stroke="#1E293B" stroke-width="28" stroke-linecap="round"/>
    <path d="M50 300 H140" stroke="#1E293B" stroke-width="28" stroke-linecap="round"/>
    <!-- Sleek Aerodynamic Helmet Silhouette -->
    <path d="M220 120 C 310 90, 430 110, 460 210 C 475 260, 450 320, 390 350 C 330 380, 240 370, 200 320 C 185 300, 185 240, 200 200 Z" fill="#E11D48"/>
    <!-- Visor -->
    <path d="M300 170 C 360 160, 420 180, 430 230 C 410 270, 340 275, 290 260 Z" fill="#0F172A"/>
    <!-- Visor Highlight reflection -->
    <path d="M320 190 C 360 185, 395 195, 410 220" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Lower chin & collar aero -->
    <path d="M240 330 C 270 380, 330 400, 380 390 C 420 380, 435 345, 420 325" stroke="#BE123C" stroke-width="18" stroke-linecap="round" fill="none"/>
  </g>
</svg>

